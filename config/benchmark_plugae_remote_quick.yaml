# Minimal remote PlugAE panel for Qwen2.5-7B.
max_loaded_models: 1
offload_path: cache/plugae_remote_quick/model_offload

default_generation_params:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  top_k: 50
  do_sample: false
  max_input_length: 1024

models:
  - model_family: Qwen2.5-7B
    pretrained_model:
      model_name: Qwen2.5-7B
      model_path: /raid/chj/fingerprint/models/Qwen2.5-7B
    instruct_model:
      model_name: Qwen2.5-7B-Instruct
      model_path: /raid/chj/fingerprint/models/Qwen2.5-7B-Instruct

training_data:
  models: []
  deploying_techniques: []
