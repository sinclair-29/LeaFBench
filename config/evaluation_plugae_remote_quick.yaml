source_model:
  model_name: Qwen2.5-7B

model_groups:
  original:
    - model_name: Qwen2.5-7B
  derivatives:
    - model_name: Qwen2.5-7B-Instruct
      modification_type: instruction_tuning
  negatives: []

evaluations:
  model_modification_robustness:
    enabled: true
    generation:
      do_sample: false
      max_new_tokens: 64
  deployment_robustness:
    enabled: false
  model_specificity:
    enabled: false
    seeds: [0]
    generation:
      do_sample: false
      max_new_tokens: 64
      input_mode: model_rendered
  prompt_stealthiness:
    enabled: false
