max_loaded_models: 1
offload_path: cache/model_offload_watermark_smoke/

default_generation_params:
  max_input_length: 2048

models:
  # Existing local chat model used only for offline integration smoke testing.
  # Override with a downloaded OPT-1.3B path for paper-faithful reproduction.
  - model_family: local-llama-2-7b-chat
    pretrained_model:
      model_name: local-llama-2-7b-chat
      model_path: /home/chj/LLMJailbreak/models/Llama-2-7b-chat-hf
    instruct_model: null
    predeployed_models: []

deploying_techniques:
  watermark:
    - method: opt
      gamma: 0.25
      beta: 2.0
      hash_key: 15485863
      significance_level: 0.01
      generation:
        do_sample: true
        temperature: 1.0
        top_p: 1.0
        top_k: 0
        max_new_tokens: 200
        min_new_tokens: 200
        suppress_eos: true

smoke:
  seed: 1234
  prompt_path: data/watermark/opt_smoke.jsonl

training_data:
  models: []
  deploying_techniques: []
