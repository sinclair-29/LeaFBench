fingerprint_method: "trap"
fingerprint_type: "black-box"
seed: 42

cached_fingerprints_path: "cache/trap/smoke_fingerprints.pth"
re_fingerprinting: true

# One trap is sufficient for verifying the pipeline.
n_goals: 1
string_type: "number_simpletarget"
string_length: 3

prompt_path: "cache/trap/smoke_prompts.csv"
regenerate_prompts: true

# Match the paper's ten stochastic completions per suffix.
test_n_times: 10
batch_size: 10

gcg_config:
  # Small fixed-step approximation of the paper's 1500-step GCG search.
  num_steps: 200
  search_width: 64
  batch_size: 64
  topk: 64
  n_replace: 1
  seed: 40
  use_prefix_cache: false
  # The paper keeps optimizing and selects the suffix with the lowest loss.
  early_stop: false
