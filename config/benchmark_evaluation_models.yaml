# Model registry for the artifact-first evaluation workflow in evaluation.py.
#
# Local checkpoints already present on the DGX use /raid/chj/fingerprint/models.
# Paper-specific derivatives that are not in that directory retain their
# Hugging Face IDs and will therefore need to be downloaded before that
# evaluation is enabled.
max_loaded_models: 1
offload_path: cache/model_offload
default_generation_params:
  max_new_tokens: 64
  temperature: 0.0
  top_p: 1.0
  top_k: 50
  do_sample: false
  max_input_length: 2048

models:
  - model_family: Qwen2.5-7B
    pretrained_model:
      model_name: Qwen2.5-7B
      model_path: /raid/chj/fingerprint/models/Qwen2.5-7B
    instruct_model:
      model_name: Qwen2.5-7B-Instruct
      model_path: /raid/chj/fingerprint/models/Qwen2.5-7B-Instruct
    predeployed_models:
      - model_name: Qwen2.5-7B-Instruct-Human-Like
        model_path: HumanLLMs/Human-Like-Qwen2.5-7B-Instruct
        type: finetune
      - model_name: Qwen2.5-7B-Instruct-SimPO
        model_path: lightblue/qwen2.5-7b-instruct-simpo
        type: finetune
      - model_name: Qwen2.5-7B-Instruct-Math-IIO
        model_path: prithivMLmods/Math-IIO-7B-Instruct
        type: finetune
      - model_name: Qwen2.5-7B-Instruct-FinancialAdvice
        model_path: nguyentd/FinancialAdvice-Qwen2.5-7B
        type: finetune
      - model_name: Qwen2.5-Coder-7B-Instruct
        model_path: Qwen/Qwen2.5-Coder-7B-Instruct
        type: finetune

  - model_family: Qwen2.5-14B
    pretrained_model:
      model_name: Qwen2.5-14B
      model_path: /raid/chj/fingerprint/models/Qwen2.5-14B
    instruct_model:
      model_name: Qwen2.5-14B-Instruct
      model_path: /raid/chj/fingerprint/models/Qwen2.5-14B-Instruct

  - model_family: Qwen2-7B
    pretrained_model:
      model_name: Qwen2-7B
      model_path: Qwen/Qwen2-7B
    instruct_model:
      model_name: Qwen2-7B-Instruct
      model_path: Qwen/Qwen2-7B-Instruct

  - model_family: Qwen2.5-3B
    pretrained_model:
      model_name: Qwen2.5-3B
      model_path: Qwen/Qwen2.5-3B
    instruct_model:
      model_name: Qwen2.5-3B-Instruct
      model_path: Qwen/Qwen2.5-3B-Instruct

  - model_family: Llama-2-7B
    pretrained_model:
      model_name: Llama-2-7B
      model_path: /raid/chj/fingerprint/models/Llama-2-7b-hf
    instruct_model:
      model_name: Llama-2-7B-Chat
      model_path: /raid/chj/fingerprint/models/Llama-2-7b-chat-hf
    predeployed_models:
      - model_name: Llama-2-7B-Chat-DPO
        model_path: Joyqiuyue/Llama-2-7b-chat-hf-dpo
        type: adapter
      - model_name: Llama-2-7B-MedQuAD
        model_path: EdwardYu/llama-2-7b-MedQuAD
        type: adapter
      - model_name: Llama-2-7B-SFT-LoRA
        model_path: aengusl/llama2-7b-sft-lora
        type: adapter
      - model_name: Llama-2-7B-AG
        model_path: surrey-nlp/AG-Llama-2-7b
        type: adapter

  - model_family: Llama-2-13B
    pretrained_model:
      model_name: Llama-2-13B
      model_path: meta-llama/Llama-2-13b-hf
    instruct_model:
      model_name: Llama-2-13B-Chat
      model_path: meta-llama/Llama-2-13b-chat-hf

  - model_family: Llama-3.1-8B
    pretrained_model:
      model_name: Llama-3.1-8B
      model_path: /raid/chj/fingerprint/models/Llama-3.1-8B
    instruct_model:
      model_name: Llama-3.1-8B-Instruct
      model_path: /raid/chj/fingerprint/models/Llama-3.1-8B-Instruct

  - model_family: Mistral-7B-v0.3
    pretrained_model:
      model_name: Mistral-7B-v0.3
      model_path: /raid/chj/fingerprint/models/Mistral-7B-v0.3
    instruct_model:
      model_name: Mistral-7B-Instruct-v0.3
      model_path: /raid/chj/fingerprint/models/Mistral-7B-Instruct-v0.3

  - model_family: Gemma-2-2B
    pretrained_model:
      model_name: Gemma-2-2B
      model_path: /raid/chj/fingerprint/models/gemma-2-2b
    instruct_model:
      model_name: Gemma-2-2B-IT
      model_path: /raid/chj/fingerprint/models/gemma-2-2b-it

  - model_family: Yi-6B
    pretrained_model:
      model_name: Yi-6B
      model_path: 01-ai/Yi-6B
    instruct_model:
      model_name: Yi-6B-Chat
      model_path: 01-ai/Yi-6B-Chat

training_data:
  models: []
