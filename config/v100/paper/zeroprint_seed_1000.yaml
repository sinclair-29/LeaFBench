fingerprint_method: zeroprint
fingerprint_type: black-box
seed: 1000
cached_fingerprints_path: cache/v100_fingerprint_paper/zeroprint/seed_1000.pth
re_fingerprinting: true
query_csv_path: data/zeroprint_humaneval_seed_1000.csv
n_samples: 2
resample: false
query_datasets: [openai_humaneval]
continuation_word_limit: 20
minimum_qa_length: 15
perturbed_queries_path: cache/v100_fingerprint_paper/zeroprint/perturbed_humaneval_v2_seed_1000.csv
word_substitution_config:
  word_vector_model: glove
  word_vector_cache_dir: /raid/chj/fingerprint/models
  k_words_to_replace: 3
  top_m_neighbors: 10
  n_augmented_samples: 4
  substitution_queries_path: cache/v100_fingerprint_paper/zeroprint/substitutions_humaneval_v2_seed_1000.csv
  max_workers: 16
nltk_data_path: /raid/chj/fingerprint/models/nltk_data
output_truncate_length: 0
embedding_model_name: /raid/chj/fingerprint/models/all-mpnet-base-v2
embedding_batch_size: 64
embeddings_path: cache/v100_fingerprint_paper/zeroprint/embeddings_humaneval_v2_seed_1000.pth
generation_batch_size: 8
num_repeats: 20
model_generation: {do_sample: true, temperature: 0.7, top_p: 0.9, top_k: 50, max_new_tokens: 512}
gradient_estimation_method: jacobian
ridge_alpha: 0.001
fingerprint_aggregation: mean
similarity_metric: correlation
