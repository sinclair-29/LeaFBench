# Minimal model panel for the TRAP/PlugAE correctness gate on DGX2-19.
# Model parameters match the paper-scale V100 registry; only the number of
# models participating in this gate is reduced.
max_loaded_models: 1
offload_path: cache/v100_trap_plugae_smoke/model_offload

default_generation_params:
  max_new_tokens: 48
  temperature: 0.0
  top_p: 1.0
  top_k: 50
  do_sample: false
  max_input_length: 1024

models:
  - model_family: Phi-3-Mini
    pretrained_model:
      model_name: Phi-3-Mini-4K-Base
      model_path: /raid/chj/fingerprint/models/Phi-3-mini-4k-base
    instruct_model:
      model_name: Phi-3-Mini-4K-Instruct
      model_path: /raid/chj/fingerprint/models/Phi-3-mini-4k-instruct

  - model_family: Qwen2.5-7B
    pretrained_model:
      model_name: Qwen2.5-7B
      model_path: /raid/chj/fingerprint/models/Qwen2.5-7B

  - model_family: Gemma-2-2B
    pretrained_model:
      model_name: Gemma-2-2B
      model_path: /raid/chj/fingerprint/models/gemma-2-2b

training_data:
  models: []
  deploying_techniques: []
